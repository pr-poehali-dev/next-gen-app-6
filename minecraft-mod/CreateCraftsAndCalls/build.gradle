plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        // Репозиторий Simple Voice Chat API
        name = 'HenkelmaxPublic'
        url = 'https://maven.maxhenkel.de/repository/public'
    }
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Simple Voice Chat API — только для компиляции, сам мод SVC на сервере ставит игрок отдельно
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"

    // Наш мод НЕ подключает Create как библиотеку — вместо этого мы используем
    // стандартный интерфейс энергии Minecraft (IEnergyStorage), к которому
    // провода Create Crafts & Additions подключаются сами, без прямой зависимости
    // в коде. Это делает сборку надёжнее и не привязывает нас к точной версии Create.
    // Create и Create Crafts & Additions игрок ставит на сервер отдельно, как обычные моды.
}

processResources {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}